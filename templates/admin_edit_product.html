<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - ANALYTIX Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-left">
                    <div class="logo">ANALYTIX Admin</div>
                </div>
                <div class="navbar-right">
                    <a href="{{ url_for('admin_products') }}" class="btn btn-outline" style="padding: 8px 16px; font-size: 13px;">← Back to Products</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="container" style="max-width: 800px;">
            <div class="page-header">
                <h1>Edit Product</h1>
            </div>
            
            <div class="form-card">
                <form method="POST" action="{{ url_for('admin_edit_product', index=product['index']) }}">
                    <div class="form-group">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="product_name" class="form-input" value="{{ product.get('product_name', '') }}" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Brand</label>
                            <input type="text" name="brand" class="form-input" value="{{ product.get('brand', '') }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Marketplace</label>
                            <input type="text" name="marketplace" class="form-input" value="{{ product.get('marketplace', '') }}" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Price (Rp)</label>
                            <input type="number" name="price" class="form-input" value="{{ product.get('price', 0)|int }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Rating (0-5)</label>
                            <input type="number" step="0.1" min="0" max="5" name="rating" class="form-input" value="{{ product.get('rating', 0) }}">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Review Count</label>
                            <input type="number" name="review_count" class="form-input" value="{{ product.get('review_count', 0)|int }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Sold Count</label>
                            <input type="number" name="sold_count" class="form-input" value="{{ product.get('sold_count', 0)|int }}">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Seller Name</label>
                            <input type="text" name="seller_name" class="form-input" value="{{ product.get('seller_name', '') }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Seller Location</label>
                            <input type="text" name="seller_location" class="form-input" value="{{ product.get('seller_location', '') }}">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Product URL</label>
                        <input type="url" name="product_url" class="form-input" value="{{ product.get('product_url', '') }}">
                    </div>
                    
                    <div class="form-actions">
                        <a href="{{ url_for('admin_products') }}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
